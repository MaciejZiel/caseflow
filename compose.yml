services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caseflow
      POSTGRES_USER: caseflow
      POSTGRES_PASSWORD: caseflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseflow -d caseflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: docker
      APP_NAME: CaseFlow AI
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      TRUSTED_HOST_PATTERNS: 127.0.0.1,localhost
      DATABASE_URL: postgresql+psycopg://caseflow:caseflow@db:5432/caseflow
      TEST_DATABASE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: change-this-to-a-32-byte-minimum-secret
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 30
      INVITATION_TTL_HOURS: 168
      LOCAL_STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE_BYTES: 10485760
    command:
      - /bin/sh
      - -lc
      - python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  storage_data:
