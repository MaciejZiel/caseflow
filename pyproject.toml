[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "caseflow"
version = "0.1.0"
description = "Production-like multi-tenant B2B backend for case and document processing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.5,<2.0.0",
  "fastapi>=0.116.1,<1.0.0",
  "prometheus-client>=0.22.1,<1.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "psycopg[binary]>=3.2.10,<4.0.0",
  "sqlalchemy>=2.0.43,<3.0.0",
  "structlog>=25.4.0,<26.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=8.4.1,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "pytest-cov>=6.2.1,<7.0.0",
  "ruff>=0.12.12,<0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
